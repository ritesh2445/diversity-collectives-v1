name = "dcvc-api"
main = "src/index.js"
compatibility_date = "2024-05-01"

[vars]
ALLOWED_ORIGIN = "https://diversitycollective.org"
FRONTEND_BASE_URL = "https://diversitycollective.org"
DCVC_STAFF_EMAIL = "info@diversitycollective.org"
RESEND_FROM_EMAIL = "Diversity Collective <noreply@diversitycollective.org>"

# Configurable Donation Appreciation Card Thresholds (in USD Dollars)
APPRECIATION_TIER_1_MIN = "1"    # Community Ally ($1 - $49)
APPRECIATION_TIER_2_MIN = "50"   # Pride Advocate ($50 - $149)
APPRECIATION_TIER_3_MIN = "150"  # Rainbow Champion ($150 - $499)
APPRECIATION_TIER_4_MIN = "500"  # Visionary Benefactor ($500+)

# Ask DCVC Free AI Chatbot Configuration
# Must remain disabled until the final environment configuration
CHATBOT_ENABLED = "false"
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

# Cloudflare Workers AI Binding (Free Tier: 10,000 neurons/day)
[ai]
binding = "AI"

# Secrets to be configured via: wrangler secret put <NAME>
# - TURSO_DATABASE_URL
# - TURSO_AUTH_TOKEN
# - RESEND_API_KEY
# - TURNSTILE_SECRET_KEY
# - ZEFFY_WEBHOOK_SECRET

[env.preview]
name = "dcvc-api-preview"
vars = { ALLOWED_ORIGIN = "*", FRONTEND_BASE_URL = "http://localhost:5173" }
