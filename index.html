<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diversity Collective Ventura County | You Are Welcome Here</title>
    <meta name="description" content="Diversity Collective Ventura County is a 501(c)(3) nonprofit providing advocacy, visibility, safety, and wellness for the LGBTQ+ community throughout Ventura County." />
    
    <!-- Modern Professional Typography: Plus Jakarta Sans, Inter, and Newsreader -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500;1,6..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Pre-Paint Recite Me Accessibility State Hydration (Anti-FOUC) -->
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('dcvc_recite_settings') || localStorage.getItem('dcvc_a11y_settings');
          var s = stored ? JSON.parse(stored) : {};

          // Apply OS defaults if not overridden by user
          if (s.pauseAnimations === undefined && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            s.pauseAnimations = true;
          }
          if (s.colorTheme === undefined && window.matchMedia && window.matchMedia('(prefers-contrast: more)').matches) {
            s.colorTheme = 'yellow-on-black';
          }

          if (s.toolbarOpen) root.setAttribute('data-recite-toolbar-open', 'true');
          if (s.fontSize) root.setAttribute('data-a11y-font-size', s.fontSize);
          if (s.fontFamily) root.setAttribute('data-a11y-font-family', s.fontFamily);
          if (s.lineHeight) root.setAttribute('data-a11y-line-height', s.lineHeight);
          if (s.letterSpacing) root.setAttribute('data-a11y-letter-spacing', s.letterSpacing);
          if (s.wordSpacing) root.setAttribute('data-a11y-word-spacing', s.wordSpacing);
          if (s.textAlign) root.setAttribute('data-a11y-text-align', s.textAlign);
          if (s.highlightLinks) root.setAttribute('data-a11y-highlight-links', 'true');
          if (s.highlightHeadings) root.setAttribute('data-a11y-highlight-headings', 'true');
          if (s.colorTheme) root.setAttribute('data-a11y-theme', s.colorTheme);
          if (s.ruler) root.setAttribute('data-a11y-ruler', 'true');
          if (s.screenMask) root.setAttribute('data-a11y-mask', 'true');
          if (s.magnifier) root.setAttribute('data-a11y-magnifier', 'true');
          if (s.plainTextMode) root.setAttribute('data-a11y-plain-text', 'true');
          if (s.margins) root.setAttribute('data-a11y-margins', s.margins);
          if (s.cursorSize) root.setAttribute('data-a11y-cursor', s.cursorSize);
          if (s.cursorHighlight) root.setAttribute('data-a11y-cursor-highlight', 'true');
          if (s.enhancedFocus) root.setAttribute('data-a11y-enhanced-focus', 'true');
          if (s.pauseAnimations) root.setAttribute('data-a11y-pause-animations', 'true');

          if (s.colorTheme === 'custom' && s.textColor && s.bgColor) {
            root.style.setProperty('--recite-custom-text', s.textColor);
            root.style.setProperty('--recite-custom-bg', s.bgColor);
            root.style.setProperty('--recite-custom-link', s.linkColor || '#5A1E65');
          }
        } catch (e) {
          // Gracefully continue with defaults
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
