<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo-square.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Diversity Collective Ventura County | You Are Welcome Here</title>
    <meta name="description" content="Diversity Collective Ventura County is a 501(c)(3) nonprofit providing advocacy, visibility, safety, and wellness for the LGBTQ+ community throughout Ventura County." />
    
    <!-- Sanity Global Edge API & Image CDN Preconnect (Instant Zero-Lag Media Delivery) -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin>
    <link rel="preconnect" href="https://6abul0sq.apicdn.sanity.io" crossorigin>

    <!-- Modern Professional Typography + Dyslexia-Friendly Typefaces (Atkinson Hyperlegible & Lexend) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Caveat:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Pre-Paint Recite Me Accessibility State Hydration (Anti-FOUC) -->
    <script>
      (function() {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem('dcvc_recite_settings') || localStorage.getItem('dcvc_a11y_settings');
          var s = stored ? JSON.parse(stored) : {};

          // Apply OS defaults if not overridden by user
          if (s.pauseAnimations === undefined && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            s.pauseAnimations = true;
          }
          if (s.colorTheme === undefined && window.matchMedia && window.matchMedia('(prefers-contrast: more)').matches) {
            s.colorTheme = 'yellow-on-black';
          }

          if (s.toolbarOpen) root.setAttribute('data-recite-toolbar-open', 'true');
          if (s.fontSize) root.setAttribute('data-a11y-font-size', s.fontSize);
          if (s.fontFamily) root.setAttribute('data-a11y-font-family', s.fontFamily);
          if (s.lineHeight) root.setAttribute('data-a11y-line-height', s.lineHeight);
          if (s.letterSpacing) root.setAttribute('data-a11y-letter-spacing', s.letterSpacing);
          if (s.wordSpacing) root.setAttribute('data-a11y-word-spacing', s.wordSpacing);
          if (s.textAlign) root.setAttribute('data-a11y-text-align', s.textAlign);
          if (s.highlightLinks) root.setAttribute('data-a11y-highlight-links', 'true');
          if (s.highlightHeadings) root.setAttribute('data-a11y-highlight-headings', 'true');
          if (s.colorTheme) root.setAttribute('data-a11y-theme', s.colorTheme);
          if (s.ruler) root.setAttribute('data-a11y-ruler', 'true');
          if (s.screenMask) root.setAttribute('data-a11y-mask', 'true');
          if (s.magnifier) root.setAttribute('data-a11y-magnifier', 'true');
          if (s.plainTextMode) root.setAttribute('data-a11y-plain-text', 'true');
          if (s.margins) root.setAttribute('data-a11y-margins', s.margins);
          if (s.cursorSize) root.setAttribute('data-a11y-cursor', s.cursorSize);
          if (s.cursorHighlight) root.setAttribute('data-a11y-cursor-highlight', 'true');
          if (s.enhancedFocus) root.setAttribute('data-a11y-enhanced-focus', 'true');
          if (s.pauseAnimations) root.setAttribute('data-a11y-pause-animations', 'true');
          if (s.dyslexiaMode) root.setAttribute('data-a11y-dyslexia-mode', 'true');
          if (s.dyslexiaTint) root.setAttribute('data-a11y-dyslexia-tint', s.dyslexiaTint);
          if (s.bionicReading) root.setAttribute('data-a11y-bionic', 'true');

          if (s.colorTheme === 'custom' && s.textColor && s.bgColor) {
            root.style.setProperty('--recite-custom-text', s.textColor);
            root.style.setProperty('--recite-custom-bg', s.bgColor);
            root.style.setProperty('--recite-custom-link', s.linkColor || '#5A1E65');
          }
        } catch (e) {
          // Gracefully continue with defaults
        }
      })();
    </script>
    <!-- Google Translate Script & Element for Sitewide Translation -->
    <div id="google_translate_element" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;z-index:-1;"></div>
    <script>
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async></script>
    <style>
      /* Hide Google Translate toolbar banner, iframes, and popup artifacts */
      .goog-te-banner-frame,
      .goog-te-balloon-frame,
      .goog-te-menu-frame,
      #goog-gt-tt,
      .goog-te-spinner-pos,
      .VIpgJd-ZVi9od-ORHb,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-SmfZ-wrapper,
      iframe.skiptranslate,
      iframe[class*="goog"],
      iframe[id*="goog"],
      iframe.goog-te-banner-frame,
      body > .skiptranslate:not(#google_translate_element),
      .goog-te-banner {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        max-width: 0 !important;
        max-height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
        opacity: 0 !important;
        pointer-events: none !important;
        overflow: hidden !important;
      }
      html, html.translated-ltr, html.translated-rtl, html[dir="rtl"], html:not([lang="en"]) {
        height: auto !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        max-width: 100vw !important;
        width: 100% !important;
      }
      body, 
      html.translated-ltr body, 
      html.translated-rtl body, 
      html[dir="rtl"] body, 
      html:not([lang="en"]) body,
      body.translated-ltr, 
      body.translated-rtl {
        top: 0 !important;
        margin-top: 0 !important;
        position: static !important;
        height: auto !important;
        min-height: 100% !important;
        overflow-x: hidden !important;
        overflow-y: visible !important;
        touch-action: manipulation !important;
        max-width: 100vw !important;
        width: 100% !important;
      }
      #root,
      html.translated-ltr #root,
      html.translated-rtl #root,
      html[dir="rtl"] #root,
      html:not([lang="en"]) #root {
        max-width: 100vw !important;
        width: 100% !important;
        overflow-x: hidden !important;
      }
      /* RTL (Arabic, Persian, Hebrew) Blink Engine Scroll Width Containment */
      html.translated-rtl,
      html[dir="rtl"],
      html.translated-rtl body,
      html[dir="rtl"] body,
      html.translated-rtl #root,
      html[dir="rtl"] #root {
        overflow-x: hidden !important;
      }
      @media (max-width: 767px) {
        .hidden.md\:block,
        .hidden.md\:flex,
        .hidden.md\:inline-flex,
        button.hidden.md\:inline-flex,
        div.hidden.md\:flex,
        span.hidden.md\:block {
          display: none !important;
        }
        .md\:hidden {
          display: flex !important;
        }
        html.translated-rtl .container-clean,
        html[dir="rtl"] .container-clean {
          max-width: 100vw !important;
          width: 100% !important;
          box-sizing: border-box !important;
          padding-left: 1rem !important;
          padding-right: 1rem !important;
        }
        #accessibility-launcher-button > div:not(:first-child),
        #ask-luna-launcher-button > div:not(:first-child) {
          display: none !important;
        }
        #accessibility-launcher-button,
        #ask-luna-launcher-button {
          padding-right: 0.5rem !important;
        }
      }
      .goog-text-highlight,
      font[style*="background"],
      font.goog-text-highlight,
      [class*="goog-text-highlight"] {
        background: transparent !important;
        background-color: transparent !important;
        box-shadow: none !important;
        color: inherit !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
